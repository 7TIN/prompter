[package]
name = "prompter"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
global-hotkey = "0.8.0"
gpui-kit = "0.7.1"
reqwest = { version = "0.13.5", features = ["json", "blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
