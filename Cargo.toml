[package]
name = "prompter"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
global-hotkey = "0.8.0"
# `test-support` is on for the application itself, not only for tests, because
# the view registers its layout regions for observation with `.test_support()`.
# Registration is inert outside a test run, and keeping one feature set means the
# markup the tests query is byte-for-byte the markup that ships.
gpui-kit = { version = "0.7.1", features = ["test-support"] }
reqwest = { version = "0.13.5", features = ["json", "blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

# Pinned to the same `windows` crate `gpui-pre-windows` already resolves, so
# this adds no second copy. Only `src/acrylic.rs` uses it, and only on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
